# OSV-Scanner reads this file next to Cargo.lock. Remove the entry when turso_core allows tantivy 0.27
# or later, which takes lru 0.18.2.
#
# The ignore lapses on ignoreUntil (OSV-Scanner stops ignoring at midnight on that date in the
# runner's time zone, which is UTC on GitHub-hosted runners), so the weekly scan fails again then.
# Extend the date only after checking that turso_core still blocks tantivy 0.27; Dependabot proposes
# a turso bump when a release lands.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0253"
ignoreUntil = 2026-12-01
reason = "lru 0.16.4 via tantivy 0.26 <- turso_core, which pins ^0.26.2 up to 0.9.0-pre.2, so no fixed path exists. The bug needs a panicking key Drop; tantivy's only cache keys are usize (src/store/reader.rs)."
