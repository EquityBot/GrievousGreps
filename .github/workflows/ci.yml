name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    timeout-minutes: 60
    # The tool stores repo-relative paths and parses them with '/', so a separator
    # leak on Windows matches nothing instead of failing. Windows stays a gate.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "current"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # Runs the package's prepare script, which is `npm run build`. The grammars
      # are native addons, and the node-gyp devDependency chooses their toolchain,
      # so keep it at 12.x whilst this matrix holds Node 20.
      - name: Install and build
        run: npm ci
      - name: Type check
        run: |
          npx tsc --noEmit -p tsconfig.json
          npx tsc --noEmit -p viewer/tsconfig.json
      - name: Test
        run: npm test
      - name: Test the benchmark scorer
        run: node --test benchmark/test/score.test.mjs

  node24-wasm:
    name: Node 24 WASM regression
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - name: Exercise every breadth grammar
        run: node --import tsx --test test/generic-node24.test.ts
