version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # node-gyp 13 requires Node 22.22 or later, and CI holds Node 20.
      - dependency-name: node-gyp
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # CodeQL refuses a workflow whose init, analyze and upload-sarif steps differ in version.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  # Cargo.toml pins turso exactly because its FTS on-disk format may change between releases, so a
  # turso bump from here is a proposal to review, not a change to merge on green.
  - package-ecosystem: cargo
    directory: /rust/gg-docs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
